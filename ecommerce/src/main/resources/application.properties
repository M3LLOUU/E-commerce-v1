spring.application.name=ecommerce-api
server.port=8080

# Conexão com o PostgreSQL via Docker (lê do .env ou usa os valores padrão)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB:lumina_db}
spring.datasource.username=${POSTGRES_USER:lumina_admin}
spring.datasource.password=${POSTGRES_PASSWORD:Lumina_Super_Segura_2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# O Hibernate cria e atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect